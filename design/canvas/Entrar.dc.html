<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, "Segoe UI", system-ui, sans-serif; font-feature-settings: "ss01"; }
    a { color: #4434d4; } a:hover { color: #2e2b8c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f6f9fc; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #1c1e54; padding: 48px 24px 40px; display: flex; flex-direction: column; gap: 12px;">
    <p style="margin: 0; color: #b9b9f9; font-size: 10px; font-weight: 400; letter-spacing: 0.1px; text-transform: uppercase;">Gestor de tarefas</p>
    <h1 style="margin: 0; color: #ffffff; font-size: 32px; font-weight: 300; letter-spacing: -0.64px; line-height: 1.1;">A operação do dia, em um só lugar.</h1>
  </div>

  <div style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 24px;">

    <div style="display: flex; gap: 4px;">
      <button style="flex-grow: 1; min-height: 44px; padding: 0 16px; border: 1px solid #533afd; border-radius: 9999px; background: #b9b9f9; color: #2e2b8c; font-family: inherit; font-size: 14px; font-weight: 400;">Funcionário</button>
      <button style="flex-grow: 1; min-height: 44px; padding: 0 16px; border: 1px solid #e3e8ee; border-radius: 9999px; background: #ffffff; color: #273951; font-family: inherit; font-size: 14px; font-weight: 400;">Liderança</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="usuario" style="color: #0d253d; font-size: 14px; font-weight: 400;">Usuário</label>
        <input id="usuario" type="text" value="fabio.reposicao" style="min-height: 44px; padding: 0 12px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; color: #0d253d; font-family: inherit; font-size: 15px;">
        <p style="margin: 0; color: #273951; font-size: 13px; letter-spacing: -0.39px;">O usuário que a liderança cadastrou.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="pin" style="color: #0d253d; font-size: 14px; font-weight: 400;">PIN</label>
        <div style="display: flex; gap: 8px;">
          <span style="flex-grow: 1; height: 56px; border: 1px solid #533afd; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #0d253d; font-size: 20px; font-variant-numeric: tabular-nums;">7</span>
          <span style="flex-grow: 1; height: 56px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #0d253d; font-size: 20px; font-variant-numeric: tabular-nums;">7</span>
          <span style="flex-grow: 1; height: 56px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #0d253d; font-size: 20px; font-variant-numeric: tabular-nums;">8</span>
          <span style="flex-grow: 1; height: 56px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #273951; font-size: 20px;"></span>
          <span style="flex-grow: 1; height: 56px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #273951; font-size: 20px;"></span>
          <span style="flex-grow: 1; height: 56px; border: 1px solid #a8c3de; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #273951; font-size: 20px;"></span>
        </div>
        <p style="margin: 0; color: #273951; font-size: 13px; letter-spacing: -0.39px;">Seis dígitos. Depois de cinco erros o acesso trava por 15 minutos.</p>
      </div>

      <button style="min-height: 44px; padding: 0 24px; border: none; border-radius: 9999px; background: #533afd; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 400;">Entrar</button>
    </div>

    <div style="margin-top: auto; padding: 16px; border: 1px solid #ea2261; border-radius: 8px; display: flex; gap: 12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ea2261" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 9v4"></path><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 17h.01"></path></svg>
      <p style="margin: 0; color: #0d253d; font-size: 14px; line-height: 1.4;">Usuário ou senha incorretos.</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
